@if (module(); as mod) {
  <section class="page" [style.--accent]="mod.accent">
    <header class="page-head">
      <p class="crumb">
        <span class="crumb-module">{{ mod.label }}</span>
        <span class="crumb-sep" aria-hidden="true">/</span>
        <span>{{ item()?.label }}</span>
      </p>
      <h1 class="page-title">{{ item()?.label }}</h1>
    </header>

    <div class="empty">
      <span class="empty-icon" aria-hidden="true">
        <app-admin-icon [name]="item()?.icon ?? mod.icon" />
      </span>
      <h2 class="empty-title">Trang này đang được xây dựng</h2>
      <p class="empty-text">
        Mục <strong>{{ item()?.label }}</strong> của {{ mod.title.toLowerCase() }} sẽ có ở đây.
      </p>
      <span class="empty-tag">
        <svg lucideConstruction class="empty-tag-icon" aria-hidden="true"></svg>
        Sắp ra mắt
      </span>
    </div>
  </section>
}
