<div
  class="dp"
  [class.is-open]="isOpen()"
  (keydown.escape)="onEscape($event)"
  (focusout)="onFocusOut($event)"
>
  <div class="dp-field" [class.is-invalid]="invalid()">
    <input
      #dateInput
      type="text"
      class="dp-input"
      inputmode="numeric"
      autocomplete="off"
      maxlength="10"
      [placeholder]="placeholder()"
      [value]="text()"
      [disabled]="disabled()"
      [attr.aria-label]="ariaLabel() || null"
      [attr.aria-invalid]="invalid() || null"
      [attr.title]="invalid() ? 'Ngày không hợp lệ hoặc nằm ngoài khoảng cho phép' : null"
      (input)="onInput($event)"
      (blur)="onInputBlur()"
      (keydown)="onInputKeydown($event)"
    />
    <button
      type="button"
      class="dp-toggle"
      aria-haspopup="dialog"
      aria-label="Mở lịch chọn ngày"
      [attr.aria-expanded]="isOpen()"
      [attr.aria-controls]="isOpen() ? panelId : null"
      [disabled]="disabled()"
      (click)="toggle()"
    >
      <svg lucideCalendar class="dp-icon" aria-hidden="true"></svg>
    </button>
  </div>

  @if (isOpen()) {
    <div class="dp-panel" role="dialog" [id]="panelId" [attr.aria-label]="ariaLabel() || 'Chọn ngày'">
      <div class="dp-head">
        <button type="button" class="dp-nav" (click)="shift(-12)" aria-label="Năm trước">
          <svg lucideChevronsLeft class="dp-nav-icon" aria-hidden="true"></svg>
        </button>
        <button type="button" class="dp-nav" (click)="shift(-1)" aria-label="Tháng trước">
          <svg lucideChevronLeft class="dp-nav-icon" aria-hidden="true"></svg>
        </button>
        <span class="dp-title" aria-live="polite">{{ monthLabel() }}</span>
        <button type="button" class="dp-nav" (click)="shift(1)" aria-label="Tháng sau">
          <svg lucideChevronRight class="dp-nav-icon" aria-hidden="true"></svg>
        </button>
        <button type="button" class="dp-nav" (click)="shift(12)" aria-label="Năm sau">
          <svg lucideChevronsRight class="dp-nav-icon" aria-hidden="true"></svg>
        </button>
      </div>

      <table class="dp-grid" role="grid" [attr.aria-label]="monthLabel()" (keydown)="onGridKeydown($event)">
        <thead>
          <tr>
            @for (wd of weekdays; track wd) {
              <th class="dp-weekday" scope="col">{{ wd }}</th>
            }
          </tr>
        </thead>
        <tbody>
          @for (week of weeks(); track $index) {
            <tr>
              @for (cell of week; track cell.iso) {
                <td role="gridcell" class="dp-cell">
                  <button
                    type="button"
                    class="dp-day"
                    [class.is-outside]="!cell.inMonth"
                    [class.is-today]="cell.isToday"
                    [class.is-selected]="cell.isSelected"
                    [class.is-disabled]="cell.isDisabled"
                    [attr.data-date]="cell.iso"
                    [attr.tabindex]="cell.iso === focusedIso() ? 0 : -1"
                    [attr.aria-selected]="cell.isSelected"
                    [attr.aria-disabled]="cell.isDisabled || null"
                    [attr.aria-current]="cell.isToday ? 'date' : null"
                    (click)="pick(cell)"
                  >
                    {{ cell.day }}
                  </button>
                </td>
              }
            </tr>
          }
        </tbody>
      </table>

      <div class="dp-foot">
        <button type="button" class="dp-link" (click)="pickToday()">Hôm nay</button>
        @if (clearable()) {
          <button type="button" class="dp-link dp-link-muted" (click)="clear()">Xóa</button>
        }
      </div>
    </div>
  }
</div>
