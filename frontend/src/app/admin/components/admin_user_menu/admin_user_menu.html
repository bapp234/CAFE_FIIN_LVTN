@if (user(); as u) {
  <div class="um">
    <button
      type="button"
      class="um-btn"
      aria-haspopup="menu"
      [attr.aria-expanded]="open()"
      (click)="toggle()"
    >
      <span class="um-avatar" aria-hidden="true">{{ initials() }}</span>
      <span class="um-meta">
        <span class="um-name">{{ u.name }}</span>
        <span class="um-role">{{ u.role }}</span>
      </span>
      <svg lucideChevronDown class="um-chev" [class.is-open]="open()" aria-hidden="true"></svg>
    </button>

    @if (open()) {
      <div class="um-pop" role="menu">
        <div class="um-pop-head">
          <strong>{{ u.name }}</strong>
          <span>{{ u.email }}</span>
        </div>
        <button type="button" role="menuitem" class="um-item" (click)="onSignOut()">
          <svg lucideLogOut class="um-item-icon" aria-hidden="true"></svg>
          Đăng xuất
        </button>
      </div>
    }
  </div>
}
