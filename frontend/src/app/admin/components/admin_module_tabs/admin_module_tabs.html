<nav class="tabs" aria-label="Phân hệ quản trị">
  @for (m of modules(); track m.key) {
    <a
      class="tab"
      [routerLink]="['/admin', m.key]"
      routerLinkActive="is-active"
      ariaCurrentWhenActive="page"
      [style.--accent]="m.accent"
      [attr.title]="m.title"
    >
      <app-admin-icon [name]="m.icon" />
      <span class="tab-label">{{ m.label }}</span>
    </a>
  }
</nav>
