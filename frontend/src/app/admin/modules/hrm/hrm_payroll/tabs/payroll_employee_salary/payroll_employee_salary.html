<!-- THANH ĐIỀU KHIỂN TRUNG TÂM (SUB-HEADER TOOLBAR) -->
<div class="sub-header-stripe">
  <div class="stripe-left">
    <div class="sub-search-wrap">
      <app-admin-search-box
        [placeholder]="'Tìm mã NV, họ tên, ngân hàng...'"
        [ariaLabel]="'Tìm kiếm trong danh sách lương nhân viên'"
        (searched)="onSearchChange($event)"
      />
    </div>

    <app-admin-combo-box
      class="combo-branch"
      [options]="branchOptions()"
      [value]="branchService.selectedBranchId()"
      (valueChange)="onBranchFilterChange($event)"
      ariaLabel="Chọn chi nhánh"
    />

    <app-admin-combo-box
      class="combo-position"
      [options]="positionOptions()"
      [value]="positionFilter()"
      (valueChange)="onPositionFilterChange($event)"
      ariaLabel="Lọc chức vụ"
    />

    <app-admin-combo-box
      class="combo-contract"
      [options]="contractOptions"
      [value]="contractFilter()"
      (valueChange)="onContractFilterChange($event)"
      ariaLabel="Lọc hình thức hưởng lương"
    />

    <app-admin-button title="Làm mới danh sách lương nhân viên" (clicked)="refreshTab()">
      <svg lucideRotateCcw [class.animate-spin]="isLoading()" aria-hidden="true"></svg>
      <span>Làm mới</span>
    </app-admin-button>
  </div>

  <div class="stripe-right">
    <app-admin-button
      title="Xuất danh sách mức lương nhân viên ra tệp Excel (.xlsx)"
      bgColor="var(--color-xanh-dam)"
      textColor="var(--color-trang)"
      (clicked)="openExportConfirm()"
    >
      <svg lucideDownload aria-hidden="true"></svg>
      <span>Xuất Excel</span>
    </app-admin-button>
  </div>
</div>

<!-- BẢNG LƯỚI DANH SÁCH LƯƠNG NHÂN VIÊN TRÀN VIỀN -->
<div class="employee-grid-container">
  <app-admin-grid-table
    ariaLabel="Bảng danh sách mức lương nhân viên"
    [columns]="employeeSalaryColumns"
    [rows]="employeeSalaryRows()"
    rowKey="code"
    [loading]="isLoading()"
    [selectedKeys]="selectedEmployeeCodes()"
    [sortBy]="sortBy()"
    [sortOrder]="sortOrder()"
    [clientSort]="true"
    [showSummary]="true"
    summaryLabel="Trung bình / Tổng định mức lương"
    actionsLabel="Hợp đồng"
    actionsWidth="8rem"
    loadingText="Đang tải danh sách định mức lương nhân viên..."
    emptyTitle="Không tìm thấy hồ sơ lương nhân viên nào"
    emptyDescription="Vui lòng thay đổi từ khóa tìm kiếm hoặc chọn bộ lọc khác."
    (rowClick)="onRowClick($event)"
    (sortChange)="onSortChange($event)"
  >
    <ng-template #actions let-row>
      <button
        type="button"
        class="row-action-btn"
        (click)="viewEmployeeContract(row, $event)"
        title="Mở hợp đồng lao động để xem hoặc điều chỉnh định mức lương"
      >
        <svg lucideFileText class="w-3.5 h-3.5" aria-hidden="true"></svg>
        <span>Xem hợp đồng</span>
      </button>
    </ng-template>
  </app-admin-grid-table>

  @if (selectedEmployeeCodes().length > 0) {
    <div class="hrm-floating-action-bar" role="region" aria-label="Thanh thao tác lương nhân viên đã chọn">
      <div class="hrm-fab-left">
        <span class="hrm-fab-count">
          Đã chọn <b>{{ selectedEmployeeCodes().length }}</b> nhân sự
        </span>
      </div>
      <div class="hrm-fab-right">
        @if (!isAllSelected()) {
          <button type="button" class="hrm-fab-btn" (click)="toggleSelectAll()">
            Chọn tất cả ({{ employeeSalaryRows().length }})
          </button>
        }
        <button type="button" class="hrm-fab-btn-clear" (click)="clearSelection()">
          Bỏ chọn
        </button>
      </div>
    </div>
  }
</div>

<!-- MODAL XÁC NHẬN XUẤT EXCEL -->
<app-admin-modal
  [isOpen]="isExportConfirmOpen()"
  title="Xuất danh sách lương nhân viên"
  [message]="'Hệ thống sẽ xuất ' + employeeSalaryRows().length + ' bản ghi định mức lương nhân viên ra tệp Excel (.xlsx) theo mẫu chuẩn Café Sài Gòn Vintage. Bạn có muốn tiếp tục?'"
  confirmText="Xuất tệp Excel"
  cancelText="Hủy bỏ"
  variant="primary"
  [isLoading]="isExporting()"
  (confirm)="confirmExportSalaryListExcel()"
  (cancel)="isExportConfirmOpen.set(false)"
/>
