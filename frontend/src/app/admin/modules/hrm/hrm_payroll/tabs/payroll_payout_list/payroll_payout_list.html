<!-- THANH ĐIỀU KHIỂN TRUNG TÂM (SUB-HEADER TOOLBAR) -->
<div class="sub-header-stripe">
  <div class="stripe-left">
    <div class="sub-search-wrap">
      <app-admin-search-box
        [placeholder]="'Tìm mã NV, họ tên...'"
        [ariaLabel]="'Tìm kiếm nhân sự trong danh sách trả lương'"
        (searched)="onSearchChange($event)"
      />
    </div>

    <app-admin-combo-box
      class="combo-branch"
      [options]="branchOptions()"
      [value]="branchService.selectedBranchId()"
      (valueChange)="onBranchFilterChange($event)"
      ariaLabel="Chọn chi nhánh"
    />

    <!-- Ô CHỌN KỲ LƯƠNG THÁNG / NĂM -->
    <app-admin-combo-box
      class="combo-period"
      [options]="periodOptions"
      [value]="selectedPeriod()"
      (valueChange)="onPeriodChange($event)"
      ariaLabel="Chọn kỳ trả lương"
    />

    <!-- Ô LỌC TRẠNG THÁI CHI TRẢ -->
    <app-admin-combo-box
      class="combo-status"
      [options]="statusFilterOptions"
      [value]="statusFilter()"
      (valueChange)="onStatusFilterChange($event)"
      ariaLabel="Lọc trạng thái trả lương"
    />

    <app-admin-button title="Làm mới bảng danh sách trả lương" (clicked)="refreshTab()">
      <svg lucideRotateCcw [class.animate-spin]="isLoading()" aria-hidden="true"></svg>
      <span>Làm mới</span>
    </app-admin-button>
  </div>

  <div class="stripe-right">
    <!-- NÚT TÍNH LƯƠNG THÁNG -->
    <app-admin-button
      [title]="
        !isAttendanceLocked()
          ? 'Bắt buộc chốt & khóa bảng công tháng trước khi tính lương'
          : 'Tính toán bảng lương từ dữ liệu chấm công và thiết lập lương'
      "
      [disabled]="!isAttendanceLocked() || isPeriodLocked() || isLoading()"
      (clicked)="recalculatePayroll()"
    >
      <svg lucideSparkles aria-hidden="true"></svg>
      <span>Tính lương</span>
    </app-admin-button>

    <!-- NÚT CHUYỂN ĐỔI KHÓA / MỞ KHÓA KỲ LƯƠNG (GOM GỌN TRẠNG THÁI & HÀNH ĐỘNG) -->
    @if (isPeriodLocked()) {
      <!-- KHI ĐÃ KHÓA: HIỂN THỊ NÚT MỞ KHÓA LƯƠNG -->
      <app-admin-button
        [title]="'Kỳ lương đã khóa bởi ' + (currentPeriodRecord()?.approvedBy || 'Quản lý') + '. Bấm để mở khóa sổ lương.'"
        [disabled]="isUnlocking()"
        bgColor="var(--color-do)"
        textColor="var(--color-trang)"
        (clicked)="confirmUnlock()"
      >
        <svg lucideUnlock aria-hidden="true"></svg>
        <span>Mở khóa lương</span>
      </app-admin-button>
    } @else {
      <!-- KHI CHƯA KHÓA: HIỂN THỊ NÚT KHÓA BẢNG LƯƠNG -->
      <app-admin-button
        title="Phê duyệt và khóa sổ bảng trả lương"
        [disabled]="payoutRows().length === 0"
        bgColor="#8c6b38"
        textColor="var(--color-trang)"
        (clicked)="confirmApprove()"
      >
        <svg lucideLock aria-hidden="true"></svg>
        <span>Khóa bảng lương</span>
      </app-admin-button>
    }

    <!-- NÚT XUẤT EXCEL -->
    <app-admin-button
      title="Xuất danh sách trả lương ra tệp Excel (.xlsx)"
      bgColor="var(--color-xanh-dam)"
      textColor="var(--color-trang)"
      (clicked)="openExportConfirm()"
    >
      <svg lucideDownload aria-hidden="true"></svg>
      <span>Xuất Excel</span>
    </app-admin-button>
  </div>
</div>

<!-- BẢNG LƯỚI DANH SÁCH TRẢ LƯƠNG TRÀN VIỀN -->
<div class="employee-grid-container">
  <app-admin-grid-table
    ariaLabel="Bảng danh sách trả lương nhân sự"
    [columns]="payoutColumns"
    [rows]="payoutRows()"
    rowKey="employeeCode"
    [loading]="isLoading()"
    [selectedKeys]="selectedEmployeeCodes()"
    [sortBy]="sortBy()"
    [sortOrder]="sortOrder()"
    [clientSort]="true"
    [showSummary]="true"
    [summaryLabel]="'Tổng quỹ trả lương kỳ ' + selectedPeriod()"
    actionsLabel="Phiếu lương"
    actionsWidth="6.5rem"
    loadingText="Đang tính toán và tải danh sách trả lương..."
    emptyTitle="Chưa có dữ liệu trả lương cho kỳ này"
    emptyDescription="Nhấn 'Tính lương' để hệ thống tổng hợp từ dữ liệu chấm công và tạm ứng."
    (rowClick)="onRowClick($event)"
    (sortChange)="onSortChange($event)"
  >
    <ng-template #actions let-row>
      <button
        type="button"
        class="row-action-btn"
        (click)="viewSlipFromRow(row)"
        title="Xem chi tiết phiếu lương cá nhân"
      >
        <svg lucideEye class="w-3.5 h-3.5" aria-hidden="true"></svg>
        <span>Phiếu</span>
      </button>
    </ng-template>
  </app-admin-grid-table>

  @if (selectedEmployeeCodes().length > 0) {
    <div class="hrm-floating-action-bar" role="region" aria-label="Thanh thao tác trả lương đã chọn">
      <div class="hrm-fab-left">
        <span class="hrm-fab-count">
          Đã chọn <b>{{ selectedEmployeeCodes().length }}</b> nhân sự
        </span>
      </div>
      <div class="hrm-fab-right">
        @if (!isAllSelected()) {
          <button type="button" class="hrm-fab-btn" (click)="toggleSelectAll()">
            Chọn tất cả ({{ payoutRows().length }})
          </button>
        }
        <button type="button" class="hrm-fab-btn-clear" (click)="clearSelection()">
          Bỏ chọn
        </button>
      </div>
    </div>
  }
</div>

<!-- MODAL KHÓA KỲ LƯƠNG -->
<app-hrm-lock-modal
  [isOpen]="isApproveModalOpen()"
  mode="lock"
  title="Khóa bảng lương"
  description="Sau khi khóa, bảng lương kỳ này sẽ được chốt để chi trả và không thể tính lại hay chỉnh sửa số liệu."
  [periodLabel]="'Kỳ lương ' + selectedPeriod()"
  [isLoading]="isApproving()"
  [errorMessage]="approveError()"
  (confirmed)="executeApprove($event)"
  (cancelled)="isApproveModalOpen.set(false)"
/>

<!-- MODAL MỞ KHÓA KỲ LƯƠNG -->
<app-hrm-lock-modal
  [isOpen]="isUnlockModalOpen()"
  mode="unlock"
  title="Mở khóa bảng lương"
  description="Mở khóa cho phép chỉnh sửa hoặc tính lại bảng lương kỳ này. Lý do mở khóa sẽ được lưu vào nhật ký kiểm soát."
  [periodLabel]="'Kỳ lương ' + selectedPeriod()"
  [isLoading]="isUnlocking()"
  [errorMessage]="unlockError()"
  (confirmed)="executeUnlock($event)"
  (cancelled)="isUnlockModalOpen.set(false)"
/>

<!-- MODAL CHI TIẾT PHIẾU LƯƠNG CÁ NHÂN -->
<app-hrm-payroll-slip-modal
  [isOpen]="isSlipModalOpen()"
  [slip]="selectedSlip()"
  (close)="isSlipModalOpen.set(false)"
/>

<!-- MODAL XÁC NHẬN XUẤT EXCEL -->
<app-admin-modal
  [isOpen]="isExportConfirmOpen()"
  title="Xuất bảng chi trả lương"
  [message]="'Hệ thống sẽ xuất ' + payoutRows().length + ' phiếu lương kỳ ' + selectedPeriod() + ' ra tệp Excel (.xlsx) theo mẫu chuẩn Café Sài Gòn Vintage. Bạn có muốn tiếp tục?'"
  confirmText="Xuất tệp Excel"
  cancelText="Hủy bỏ"
  variant="primary"
  [isLoading]="isExporting()"
  (confirm)="confirmExportPayoutExcel()"
  (cancel)="isExportConfirmOpen.set(false)"
/>
