<!-- THANH ĐIỀU KHIỂN TRUNG TÂM (SUB-HEADER TOOLBAR) -->
<div class="sub-header-stripe">
  <div class="stripe-left">
    <div class="sub-search-wrap">
      <app-admin-search-box
        [placeholder]="'Tìm mã NV, họ tên...'"
        [ariaLabel]="'Tìm kiếm nhân sự trong danh sách phép năm'"
        (searched)="onSearchChange($event)"
      />
    </div>

    <app-admin-combo-box
      class="combo-branch"
      [options]="branchOptions()"
      [value]="branchService.selectedBranchId()"
      (valueChange)="onBranchFilterChange($event)"
      ariaLabel="Chọn chi nhánh"
    />

    <!-- Ô CHỌN NĂM QUẢN LÝ QUỸ PHÉP -->
    <app-admin-combo-box
      class="combo-year"
      [options]="yearOptions"
      [value]="selectedYear()"
      (valueChange)="onYearChange($event)"
      ariaLabel="Chọn năm phép"
    />

    <!-- Ô LỌC TÌNH TRẠNG QUỸ PHÉP -->
    <app-admin-combo-box
      class="combo-status"
      [options]="leaveStatusOptions"
      [value]="leaveStatusFilter()"
      (valueChange)="onLeaveStatusFilterChange($event)"
      ariaLabel="Lọc tình trạng phép năm"
    />

    <app-admin-button title="Làm mới danh sách phép năm" (clicked)="refreshTab()">
      <svg lucideRotateCcw [class.animate-spin]="isLoading()" aria-hidden="true"></svg>
      <span>Làm mới</span>
    </app-admin-button>
  </div>

  <div class="stripe-right">
    <app-admin-button
      title="Xuất danh sách quỹ phép năm nhân viên ra tệp Excel (.xlsx)"
      bgColor="var(--color-xanh-dam)"
      textColor="var(--color-trang)"
      (clicked)="openExportConfirm()"
    >
      <svg lucideDownload aria-hidden="true"></svg>
      <span>Xuất Excel phép năm</span>
    </app-admin-button>
  </div>
</div>

<!-- BẢNG LƯỚI QUỸ PHÉP NĂM NHÂN VIÊN TRÀN VIỀN -->
<div class="employee-grid-container">
  <app-admin-grid-table
    ariaLabel="Bảng danh sách phép năm nhân viên"
    [columns]="annualLeaveColumns"
    [rows]="annualLeaveRows()"
    rowKey="code"
    [loading]="isLoading()"
    [selectedKeys]="selectedEmployeeCodes()"
    [sortBy]="sortBy()"
    [sortOrder]="sortOrder()"
    [clientSort]="true"
    loadingText="Đang tải dữ liệu quỹ phép năm nhân viên..."
    emptyTitle="Không tìm thấy hồ sơ phép năm nào"
    emptyDescription="Vui lòng thay đổi từ khóa tìm kiếm hoặc chọn bộ lọc khác."
    (rowClick)="onRowClick($event)"
    (sortChange)="onSortChange($event)"
  />

  @if (selectedEmployeeCodes().length > 0) {
    <div class="hrm-floating-action-bar" role="region" aria-label="Thanh thao tác phép năm đã chọn">
      <div class="hrm-fab-left">
        <span class="hrm-fab-count">
          Đã chọn <b>{{ selectedEmployeeCodes().length }}</b> nhân sự
        </span>
      </div>
      <div class="hrm-fab-right">
        @if (!isAllSelected()) {
          <button type="button" class="hrm-fab-btn" (click)="toggleSelectAll()">
            Chọn tất cả ({{ annualLeaveRows().length }})
          </button>
        }
        <button type="button" class="hrm-fab-btn-clear" (click)="clearSelection()">
          Bỏ chọn
        </button>
      </div>
    </div>
  }
</div>

<!-- DRAWER GHI NHẬN NGHỈ PHÉP / CẬP NHẬT QUỸ PHÉP NĂM -->
<app-admin-drawer
  [isOpen]="isLeaveDrawerOpen()"
  [title]="'Cập nhật phép năm ' + selectedYear()"
  [subtitle]="editingLeaveRow() ? editingLeaveRow()!['code'] + ' · ' + editingLeaveRow()!['fullName'] : ''"
  width="28rem"
  (close)="isLeaveDrawerOpen.set(false)"
>
  <form class="drawer-form" [formGroup]="leaveForm" (ngSubmit)="saveLeaveUpdate()">
    <div class="form-row-2">
      <app-admin-form-field label="Phép tiêu chuẩn năm (ngày)" htmlFor="lv-standard" [required]="true">
        <input id="lv-standard" type="number" step="0.5" formControlName="standardLeave" />
      </app-admin-form-field>

      <app-admin-form-field label="Phép thâm niên / thưởng" htmlFor="lv-seniority">
        <input id="lv-seniority" type="number" step="0.5" formControlName="seniorityLeave" />
      </app-admin-form-field>
    </div>

    <div class="form-row-2">
      <app-admin-form-field label="Phép tồn năm cũ chuyển sang" htmlFor="lv-carried">
        <input id="lv-carried" type="number" step="0.5" formControlName="carriedOver" />
      </app-admin-form-field>

      <app-admin-form-field label="Tổng số ngày đã nghỉ" htmlFor="lv-used" [required]="true">
        <input id="lv-used" type="number" step="0.5" formControlName="usedLeave" />
      </app-admin-form-field>
    </div>

    <app-admin-form-field label="Ghi chú duyệt nghỉ phép" htmlFor="lv-note">
      <textarea
        id="lv-note"
        rows="3"
        formControlName="note"
        placeholder="Ví dụ: Nghỉ phép cá nhân đợt tháng 11/2026..."
      ></textarea>
    </app-admin-form-field>
  </form>

  <div footer class="drawer-actions">
    <button
      type="button"
      class="btn-cancel-action"
      (click)="isLeaveDrawerOpen.set(false)"
    >
      Hủy bỏ
    </button>
    <button type="button" class="btn-save" (click)="saveLeaveUpdate()">
      Lưu quỹ phép
    </button>
  </div>
</app-admin-drawer>

<!-- MODAL XÁC NHẬN XUẤT EXCEL -->
<app-admin-modal
  [isOpen]="isExportConfirmOpen()"
  title="Xuất danh sách phép năm nhân viên"
  [message]="'Hệ thống sẽ xuất quỹ phép năm ' + selectedYear() + ' cho ' + (selectedEmployeeCodes().length > 0 ? selectedEmployeeCodes().length : annualLeaveRows().length) + ' nhân sự ra tệp Excel (.xlsx) theo mẫu chuẩn Café Sài Gòn Vintage. Bạn có muốn tiếp tục?'"
  confirmText="Xuất tệp Excel"
  cancelText="Hủy bỏ"
  variant="primary"
  [isLoading]="isExporting()"
  (confirm)="confirmExportAnnualLeaveExcel()"
  (cancel)="isExportConfirmOpen.set(false)"
/>
