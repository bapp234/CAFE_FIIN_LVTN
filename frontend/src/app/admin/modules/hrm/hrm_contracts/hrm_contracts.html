<div class="folder-shell">
  <!-- TẦNG 1: 4 TAB QUẢN LÝ HỢP ĐỒNG -->
  <div class="folder-tabs-header">
    <div class="tabs-container">
      <a routerLink="hien-tai" routerLinkActive="active" class="folder-tab-btn">
        <span class="tab-label">Hợp đồng hiện tại</span>
      </a>
      <a routerLink="den-han-ky" routerLinkActive="active" class="folder-tab-btn">
        <span class="tab-label">Danh sách đến hạn ký hợp đồng</span>
      </a>
      <a routerLink="lich-su" routerLinkActive="active" class="folder-tab-btn">
        <span class="tab-label">Lịch sử ký hợp đồng</span>
      </a>
      @if (canManageSettings()) {
        <a routerLink="thiet-lap" routerLinkActive="active" class="folder-tab-btn">
          <span class="tab-label">Thiết lập hợp đồng</span>
        </a>
      }
    </div>
  </div>

  <!-- TẦNG 2: NỘI DUNG TỪNG TAB -->
  <div class="folder-body-outlet">
    <router-outlet />
  </div>
</div>
