<div class="shifts-page">
  <!-- 1. Page Header (Đầy đủ tiêu đề, chọn chi nhánh và cụm công cụ Excel / Thêm ca) -->
  <app-admin-page-header
    title="Ca làm & Lịch tuần"
    subtitle="Lập lịch phân ca làm việc hàng tuần, quản lý mẫu ca và điều phối nhân sự theo từng chi nhánh"
    module="HRM"
    moduleLabel="Quản trị Nhân sự"
    modulePath="hrm"
    [showBranchSelector]="true"
  >
    <div actions class="header-actions">
      <!-- Nút tải file mẫu -->
      <button
        type="button"
        class="btn-tool-secondary"
        (click)="downloadExcelTemplate()"
        title="Tải tệp Excel mẫu (.csv UTF-8) để nhập dữ liệu phân ca"
      >
        <svg lucideFileText class="btn-tool-icon text-green" aria-hidden="true"></svg>
        <span>File mẫu</span>
      </button>

      <!-- Nút Nhập ca làm bằng file Excel -->
      <label
        class="btn-tool-secondary btn-upload-label"
        title="Nhập ca làm việc hàng loạt từ tệp Excel / CSV"
        [class.is-loading]="isImporting()"
      >
        <svg lucideUpload class="btn-tool-icon text-cyan" aria-hidden="true"></svg>
        <span>{{ isImporting() ? 'Đang đọc tệp...' : 'Nhập Excel' }}</span>
        <input
          type="file"
          class="hidden-file-input"
          accept=".csv, .xlsx, .xls, text/csv"
          (change)="onImportExcel($event)"
          [disabled]="isImporting()"
        />
      </label>

      <!-- Nút Xuất lịch phân ca ra file Excel -->
      <button
        type="button"
        class="btn-tool-secondary"
        (click)="onExportExcel()"
        title="Xuất bảng phân ca tuần hiện tại ra tệp Excel (.csv UTF-8)"
      >
        <svg lucideDownload class="btn-tool-icon text-brown" aria-hidden="true"></svg>
        <span>Xuất Excel</span>
      </button>

      <!-- Nút Thêm mẫu ca mới -->
      <button
        type="button"
        class="btn-primary-action"
        (click)="openCreateTemplate()"
        title="Cấu hình thêm một mẫu ca làm việc mới"
      >
        <svg lucidePlus class="btn-primary-icon" aria-hidden="true"></svg>
        <span>Thêm mẫu ca</span>
      </button>
    </div>
  </app-admin-page-header>

  <!-- 2. View Mode Switcher Tab Bar -->
  <div class="tab-bar">
    <button
      type="button"
      class="tab-btn"
      [class.tab-btn-active]="activeTab() === 'schedule'"
      (click)="activeTab.set('schedule')"
    >
      <svg lucideCalendar class="tab-icon" aria-hidden="true"></svg>
      <span>Lưới xếp lịch tuần (Schedule Grid)</span>
    </button>
    <button
      type="button"
      class="tab-btn"
      [class.tab-btn-active]="activeTab() === 'templates'"
      (click)="activeTab.set('templates')"
    >
      <svg lucideClock class="tab-icon" aria-hidden="true"></svg>
      <span>Danh mục mẫu ca (Shift Templates)</span>
    </button>
  </div>

  <!-- 3. Content 1: Weekly Schedule Grid -->
  @if (activeTab() === 'schedule') {
    <section class="schedule-section">
      <app-hrm-schedule-grid
        [employees]="employees()"
        [shiftTemplates]="templates()"
        [assignments]="assignments()"
        [weekStart]="weekStart()"
        (assignShift)="onAssignShift($event)"
        (removeShift)="onRemoveShift($event)"
        (changeWeek)="onWeekChange($event)"
      />
    </section>
  }

  <!-- 4. Content 2: Shift Templates CRUD -->
  @if (activeTab() === 'templates') {
    <section class="templates-section">
      <div class="template-grid">
        @for (t of templates(); track t.id) {
          <article class="template-card">
            <div class="template-top">
              <span class="template-code">{{ t.code }}</span>
              <div class="template-actions">
                <button type="button" class="btn-t-action" (click)="openEditTemplate(t)" title="Sửa thông tin ca">
                  <svg lucideEdit class="t-icon" aria-hidden="true"></svg>
                </button>
              </div>
            </div>

            <h3 class="template-name">{{ t.name }}</h3>

            <div class="template-meta">
              <div class="meta-row">
                <span class="meta-label">Khung giờ:</span>
                <strong class="meta-val">{{ t.startTime }} – {{ t.endTime }}</strong>
              </div>
              <div class="meta-row">
                <span class="meta-label">Giờ công chuẩn:</span>
                <span class="meta-val font-semibold">{{ t.standardHours }} giờ</span>
              </div>
              <div class="meta-row">
                <span class="meta-label">Nghỉ giữa ca:</span>
                <span class="meta-val">{{ t.breakMinutes }} phút</span>
              </div>
            </div>
          </article>
        }
      </div>
    </section>
  }

  <!-- 5. Drawer Add/Edit Template -->
  <app-admin-drawer
    [isOpen]="isDrawerOpen()"
    [title]="editingTemplateId() ? 'Chỉnh sửa mẫu ca làm việc' : 'Thêm mẫu ca làm việc mới'"
    subtitle="Cấu hình khung giờ bắt đầu, kết thúc và giờ công chuẩn của ca"
    width="28rem"
    (close)="isDrawerOpen.set(false)"
  >
    <form class="drawer-form" [formGroup]="templateForm" (ngSubmit)="saveTemplate()">
      <app-admin-form-field label="Mã ca làm việc" htmlFor="t-code" [required]="true">
        <input id="t-code" type="text" formControlName="code" placeholder="Ví dụ: CA-SANG" />
      </app-admin-form-field>

      <app-admin-form-field label="Tên ca làm việc" htmlFor="t-name" [required]="true">
        <input id="t-name" type="text" formControlName="name" placeholder="Ví dụ: Ca Sáng (Mở quán)" />
      </app-admin-form-field>

      <div class="form-row-2">
        <app-admin-form-field label="Giờ bắt đầu" htmlFor="t-start" [required]="true">
          <input id="t-start" type="time" formControlName="startTime" />
        </app-admin-form-field>

        <app-admin-form-field label="Giờ kết thúc" htmlFor="t-end" [required]="true">
          <input id="t-end" type="time" formControlName="endTime" />
        </app-admin-form-field>
      </div>

      <div class="form-row-2">
        <app-admin-form-field label="Giờ công chuẩn (h)" htmlFor="t-hours" [required]="true">
          <input id="t-hours" type="number" step="0.5" formControlName="standardHours" />
        </app-admin-form-field>

        <app-admin-form-field label="Nghỉ giữa ca (phút)" htmlFor="t-break">
          <input id="t-break" type="number" formControlName="breakMinutes" />
        </app-admin-form-field>
      </div>
    </form>

    <div footer class="drawer-actions">
      <button type="button" class="btn-cancel" (click)="isDrawerOpen.set(false)">Hủy bỏ</button>
      <button type="button" class="btn-save" (click)="saveTemplate()">Lưu mẫu ca</button>
    </div>
  </app-admin-drawer>
</div>
