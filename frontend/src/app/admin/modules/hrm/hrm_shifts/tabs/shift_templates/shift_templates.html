<!-- THANH ĐIỀU KHIỂN TRUNG TÂM (SUB-HEADER TOOLBAR) -->
<div class="sub-header-stripe">
  <div class="stripe-left">
    <div class="sub-search-wrap">
      <app-admin-search-box
        [placeholder]="'Tìm kiếm mẫu ca...'"
        [ariaLabel]="'Tìm kiếm mã ca hoặc tên mẫu ca'"
        (searched)="onSearchChange($event)"
      />
    </div>

    <app-admin-button title="Làm mới danh mục mẫu ca" (clicked)="refreshTab()">
      <svg lucideRotateCcw [class.animate-spin]="isLoading()" aria-hidden="true"></svg>
      <span>Làm mới</span>
    </app-admin-button>
  </div>

  <div class="stripe-right">
    <!-- NÚT THÊM MẪU CA MỚI: NỀN XANH ĐỒNG BỘ -->
    <app-admin-button
      title="Cấu hình thêm một mẫu ca làm việc mới"
      bgColor="var(--color-xanh-dam)"
      textColor="var(--color-trang)"
      (clicked)="openCreateTemplate()"
    >
      <svg lucidePlus aria-hidden="true"></svg>
      <span>Thêm mẫu ca</span>
    </app-admin-button>
  </div>
</div>

<!-- BẢNG LƯỚI DANH MỤC MẪU CA TOÀN DIỆN & TRÀN VIỀN -->
<div class="employee-grid-container">
  <app-admin-grid-table
    ariaLabel="Bảng lưới danh mục mẫu ca làm việc"
    [columns]="templateColumns"
    [rows]="templateRows()"
    rowKey="code"
    [loading]="isLoading()"
    [selectedKeys]="selectedTemplateCodes()"
    [sortBy]="sortBy()"
    [sortOrder]="sortOrder()"
    [clientSort]="true"
    actionsLabel="Thao tác"
    actionsWidth="8.5rem"
    loadingText="Đang nạp danh mục mẫu ca từ hệ thống..."
    emptyTitle="Không tìm thấy mẫu ca làm việc nào"
    emptyDescription="Vui lòng thay đổi từ khóa tìm kiếm hoặc nhấn 'Thêm mẫu ca' để khởi tạo mới."
    (rowClick)="onRowClick($event)"
    (sortChange)="onSortChange($event)"
  >
    <ng-template #actions let-row>
      <div class="action-btn-group">
        <button
          type="button"
          class="row-icon-btn"
          (click)="duplicateFromRow(row)"
          title="Nhân bản mẫu ca này"
        >
          <svg lucideCopy aria-hidden="true"></svg>
        </button>
        <button
          type="button"
          class="row-icon-btn"
          (click)="editFromRow(row)"
          title="Chỉnh sửa mẫu ca"
        >
          <svg lucideEdit aria-hidden="true"></svg>
        </button>
        <button
          type="button"
          class="row-icon-btn btn-delete"
          (click)="deleteFromRow(row)"
          title="Xóa mẫu ca này"
        >
          <svg lucideTrash2 aria-hidden="true"></svg>
        </button>
      </div>
    </ng-template>
  </app-admin-grid-table>

  @if (selectedTemplateCodes().length > 0) {
    <div class="hrm-floating-action-bar" role="region" aria-label="Thanh thao tác mẫu ca đã chọn">
      <div class="hrm-fab-left">
        <span class="hrm-fab-count">
          Đã chọn <b>{{ selectedTemplateCodes().length }}</b> mẫu ca
        </span>
      </div>
      <div class="hrm-fab-right">
        @if (!isAllSelected()) {
          <button type="button" class="hrm-fab-btn" (click)="toggleSelectAll()">
            Chọn tất cả ({{ templateRows().length }})
          </button>
        }
        <button type="button" class="hrm-fab-btn-clear" (click)="clearSelection()">
          Bỏ chọn
        </button>
      </div>
    </div>
  }
</div>

<!-- DRAWER THÊM / SỬA MẪU CA LÀM VIỆC -->
<app-admin-drawer
  [isOpen]="isDrawerOpen()"
  [title]="editingTemplateId() ? 'Chỉnh sửa mẫu ca làm việc' : 'Thêm mẫu ca làm việc mới'"
  subtitle="Cấu hình khung giờ bắt đầu, kết thúc và giờ công chuẩn của ca"
  width="28rem"
  (close)="isDrawerOpen.set(false)"
>
  <form class="drawer-form" [formGroup]="templateForm" (ngSubmit)="saveTemplate()">
    <app-admin-form-field label="Mã ca làm việc" htmlFor="t-code" [required]="true">
      <input id="t-code" type="text" formControlName="code" placeholder="Ví dụ: CA-SANG" />
    </app-admin-form-field>

    <app-admin-form-field label="Tên ca làm việc" htmlFor="t-name" [required]="true">
      <input id="t-name" type="text" formControlName="name" placeholder="Ví dụ: Ca Sáng (Mở quán)" />
    </app-admin-form-field>

    <div class="form-row-2">
      <app-admin-form-field label="Giờ bắt đầu" htmlFor="t-start" [required]="true">
        <input id="t-start" type="time" formControlName="startTime" (change)="recalculateHours()" />
      </app-admin-form-field>

      <app-admin-form-field label="Giờ kết thúc" htmlFor="t-end" [required]="true">
        <input id="t-end" type="time" formControlName="endTime" (change)="recalculateHours()" />
      </app-admin-form-field>
    </div>

    <div class="form-row-2">
      <app-admin-form-field label="Giờ công chuẩn (h)" htmlFor="t-hours" [required]="true">
        <input id="t-hours" type="number" step="0.25" formControlName="standardHours" />
      </app-admin-form-field>

      <app-admin-form-field label="Nghỉ giữa ca (phút)" htmlFor="t-break">
        <input id="t-break" type="number" formControlName="breakMinutes" (input)="recalculateHours()" />
      </app-admin-form-field>
    </div>

    <app-admin-form-field label="Nhóm màu hiển thị trên bảng lịch" htmlFor="t-color">
      <select id="t-color" formControlName="color">
        <option value="emerald">Xanh lá (Ca Sáng)</option>
        <option value="amber">Vàng cam (Ca Chiều)</option>
        <option value="indigo">Xanh lam (Ca Tối)</option>
        <option value="rose">Đỏ đô (Ca Full / Gãy)</option>
      </select>
    </app-admin-form-field>
  </form>

  <div footer class="drawer-actions">
    <button
      type="button"
      class="btn-cancel-action px-4 py-2 text-xs font-semibold rounded cursor-pointer"
      (click)="isDrawerOpen.set(false)"
    >
      Hủy bỏ
    </button>
    <button type="button" class="btn-save" (click)="saveTemplate()">
      Lưu mẫu ca
    </button>
  </div>
</app-admin-drawer>

<!-- MODAL XÁC NHẬN XÓA MẪU CA -->
<app-admin-modal
  [isOpen]="isDeleteModalOpen()"
  title="Xác nhận xóa mẫu ca làm việc"
  [message]="deletingTemplate()
    ? 'Bạn có chắc chắn muốn xóa mẫu ca &quot;' + deletingTemplate()?.name + '&quot; (' + deletingTemplate()?.code + ') khỏi hệ thống? Thao tác này không thể hoàn tác.'
    : 'Bạn có chắc chắn muốn xóa mẫu ca làm việc này không?'"
  confirmText="Xác nhận xóa"
  cancelText="Hủy bỏ"
  variant="danger"
  (confirm)="confirmDelete()"
  (cancel)="cancelDelete()"
/>
