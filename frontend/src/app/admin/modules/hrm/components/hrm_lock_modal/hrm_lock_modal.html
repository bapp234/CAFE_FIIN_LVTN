<app-admin-modal
  [isOpen]="isOpen()"
  [title]="title()"
  [message]="resolvedDescription()"
  [confirmText]="mode() === 'lock' ? 'Xác nhận khóa' : 'Xác nhận mở khóa'"
  cancelText="Hủy bỏ"
  [variant]="mode() === 'lock' ? 'warning' : 'danger'"
  [isLoading]="isLoading()"
  (confirm)="onConfirm()"
  (cancel)="onCancel()"
>
  <div class="lock-modal-form">
    @if (periodLabel()) {
      <div
        class="lock-period-card"
        [class.is-unlock]="mode() === 'unlock'"
      >
        <span class="lock-period-icon" aria-hidden="true">
          @if (mode() === 'lock') {
            <svg lucideLock class="w-4 h-4"></svg>
          } @else {
            <svg lucideUnlock class="w-4 h-4"></svg>
          }
        </span>
        <div class="lock-period-meta">
          <span class="lock-period-caption">Phạm vi áp dụng</span>
          <strong class="lock-period-value">{{ periodLabel() }}</strong>
        </div>
      </div>
    }

    <div class="lock-field">
      <div class="lock-label-row">
        <label class="lock-label" [attr.for]="passwordFieldId()">
          Mật khẩu xác nhận <span class="req" aria-hidden="true">*</span>
        </label>
      </div>

      <div class="lock-input-wrap">
        <svg lucideKeyRound class="lock-input-icon" aria-hidden="true"></svg>
        <input
          #passwordInput
          [id]="passwordFieldId()"
          [type]="showPassword() ? 'text' : 'password'"
          class="lock-input"
          [class.is-invalid]="invalidField() === 'password'"
          placeholder="Nhập mật khẩu khóa/mở khóa..."
          [ngModel]="password()"
          (ngModelChange)="onPasswordChange($event)"
          (keyup.enter)="onPasswordEnter()"
          [disabled]="isLoading()"
          [attr.aria-invalid]="invalidField() === 'password' ? 'true' : null"
          autocomplete="off"
        />
        <button
          type="button"
          class="lock-toggle-pwd"
          [disabled]="isLoading()"
          [attr.aria-label]="showPassword() ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'"
          [attr.aria-pressed]="showPassword()"
          (click)="togglePasswordVisibility()"
        >
          @if (showPassword()) {
            <svg lucideEyeOff class="w-4 h-4" aria-hidden="true"></svg>
          } @else {
            <svg lucideEye class="w-4 h-4" aria-hidden="true"></svg>
          }
        </button>
      </div>
    </div>

    @if (mode() === 'unlock') {
      <div class="lock-field">
        <div class="lock-label-row">
          <label class="lock-label" [attr.for]="reasonFieldId()">
            Lý do mở khóa <span class="req" aria-hidden="true">*</span>
          </label>
          <span
            class="lock-counter"
            [class.is-valid]="isReasonValid()"
          >
            {{ reasonTrimmedLength() }}/{{ minReasonLength }}+ ký tự
          </span>
        </div>

        <textarea
          #reasonInput
          [id]="reasonFieldId()"
          class="lock-textarea"
          [class.is-invalid]="invalidField() === 'reason'"
          rows="3"
          placeholder="Nêu rõ lý do cần mở khóa để lưu nhật ký kiểm soát..."
          [ngModel]="reason()"
          (ngModelChange)="onReasonChange($event)"
          (keydown)="onReasonKeydown($event)"
          [disabled]="isLoading()"
          [attr.aria-invalid]="invalidField() === 'reason' ? 'true' : null"
        ></textarea>
      </div>
    }

    @if (displayError()) {
      <div class="lock-error" role="alert">
        <svg lucideAlertTriangle class="lock-error-icon" aria-hidden="true"></svg>
        <span>{{ displayError() }}</span>
      </div>
    }
  </div>
</app-admin-modal>
