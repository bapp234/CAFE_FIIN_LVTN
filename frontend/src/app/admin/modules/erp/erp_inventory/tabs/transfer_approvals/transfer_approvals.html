<div class="sub-header-stripe">
  <div class="stripe-left">
    <app-admin-combo-box
      [options]="statusOptions"
      [value]="statusFilter()"
      width="11rem"
      (valueChange)="statusFilter.set($event); refreshTab()"
      ariaLabel="Lọc theo trạng thái phiếu"
    />
    <app-admin-button title="Làm mới" (clicked)="refreshTab()">
      <svg lucideRotateCcw aria-hidden="true"></svg>
      <span>Làm mới</span>
    </app-admin-button>
  </div>
  <div class="stripe-right">
    <span class="count-badge">Tổng phiếu: <b>{{ rows().length }}</b></span>
  </div>
</div>

<div class="employee-grid-container">
  <app-admin-grid-table
    ariaLabel="Bảng duyệt phiếu điều chuyển và cấp định kỳ"
    [columns]="columns"
    [rows]="rows()"
    rowKey="transferId"
    [loading]="isLoading()"
    [showIndex]="true"
    indexLabel="STT"
    [frozenCount]="3"
    actionsLabel="Duyệt"
    actionsWidth="6.5rem"
  >
    <ng-template #actions let-row>
      @if (row['status'] === 'Requested') {
        <div class="row-actions-wrap">
          <button type="button" class="row-action-btn is-ok" title="Duyệt xuất kho" (click)="approve(row)">
            <svg lucideCheck class="w-3.5 h-3.5" aria-hidden="true"></svg>
          </button>
          <button type="button" class="row-action-btn is-danger" title="Từ chối" (click)="reject(row)">
            <svg lucideX class="w-3.5 h-3.5" aria-hidden="true"></svg>
          </button>
        </div>
      }
    </ng-template>
  </app-admin-grid-table>
</div>
