<div class="demo-page">
  <!-- Page Header -->
  <app-admin-page-header
    title="Hạ tầng Dùng chung (Shared Components)"
    subtitle="Màn hình nghiệm thu Giai đoạn 3: Kiểm thử toàn bộ các thành phần giao diện chuỗi cửa hàng"
    module="DEMO"
    moduleLabel="Thư viện Thành phần"
    [showBranchSelector]="true"
  >
    <div actions class="header-actions">
      <button type="button" class="btn-primary" (click)="openCreateDrawer()">
        <svg lucidePlus class="btn-icon" aria-hidden="true"></svg>
        <span>Thêm nhân viên</span>
      </button>
    </div>
  </app-admin-page-header>

  <!-- Stat Cards Grid -->
  <section class="stat-grid" aria-label="Các chỉ số chính">
    <app-admin-stat-card
      label="Tổng nhân sự chuỗi"
      [value]="totalCount()"
      diff="+2 người"
      trend="up"
      trendLabel="so với tháng trước"
      icon="users"
    />
    <app-admin-stat-card
      label="Nhân viên chính thức"
      [value]="workingCount()"
      diff="Ổn định"
      trend="neutral"
      icon="clock"
    />
    <app-admin-stat-card
      label="Đang thử việc"
      [value]="probationCount()"
      diff="+1 nhân sự mới"
      trend="up"
      icon="activity"
    />
    <app-admin-stat-card
      label="Đơn giá giờ bình quân"
      [value]="averageRate()"
      diff="+3.5%"
      trend="up"
      icon="dollar"
    />
  </section>

  <!-- Toast Trigger Demo Bar -->
  <div class="toast-test-bar">
    <span class="test-label">
      <svg lucideBell class="test-icon" aria-hidden="true"></svg>
      Thử nghiệm hệ thống thông báo (Admin Toast):
    </span>
    <div class="toast-btn-group">
      <button type="button" class="btn-toast-test toast-btn-success" (click)="triggerTestToast('success')">
        Toast Thành công
      </button>
      <button type="button" class="btn-toast-test toast-btn-warning" (click)="triggerTestToast('warning')">
        Toast Cảnh báo
      </button>
      <button type="button" class="btn-toast-test toast-btn-error" (click)="triggerTestToast('error')">
        Toast Lỗi
      </button>
      <button type="button" class="btn-toast-test toast-btn-info" (click)="triggerTestToast('info')">
        Toast Thông tin
      </button>
    </div>
  </div>

  <!-- Filter Bar -->
  <app-admin-filter-bar
    placeholder="Tìm kiếm mã NV, tên, số điện thoại..."
    [searchValue]="searchQuery()"
    [hasActiveFilters]="searchQuery() !== '' || statusFilter() !== 'all'"
    (searchChange)="onSearchChange($event)"
    (reset)="onResetFilters()"
  >
    <div filters class="filter-dropdowns">
      <select
        class="filter-select"
        [value]="statusFilter()"
        (change)="onStatusFilterChange($event)"
        aria-label="Lọc theo trạng thái"
      >
        <option value="all">Tất cả trạng thái</option>
        <option value="working">Đang làm việc</option>
        <option value="probation">Đang thử việc</option>
        <option value="resigned">Đã thôi việc</option>
      </select>
    </div>
  </app-admin-filter-bar>

  <!-- Data Table with Custom Row Template -->
  <app-admin-data-table
    [columns]="columns"
    [items]="pagedEmployees()"
    [total]="filteredEmployees().length"
    [page]="currentPage()"
    [size]="pageSize()"
    [sortBy]="sortBy()"
    [sortOrder]="sortOrder()"
    [selectable]="true"
    [selectedIds]="selectedEmployeeIds()"
    (pageChange)="currentPage.set($event)"
    (sizeChange)="pageSize.set($event); currentPage.set(1)"
    (sortChange)="onSortChange($event)"
    (selectionChange)="selectedEmployeeIds.set($event)"
  >
    <ng-template #rowTemplate let-emp let-isSelected="isSelected">
      <tr class="data-row" [class.row-selected]="isSelected">
        <td class="col-checkbox">
          <input
            type="checkbox"
            class="row-checkbox"
            [checked]="isSelected"
            (change)="$event.stopPropagation(); selectedEmployeeIds.set(
              isSelected
                ? selectedEmployeeIds().filter(id => id !== emp.id)
                : [...selectedEmployeeIds(), emp.id]
            )"
          />
        </td>
        <td><strong class="emp-code">{{ emp.code }}</strong></td>
        <td>
          <div class="emp-name-wrap">
            <span class="emp-name">{{ emp.fullName }}</span>
            <span class="emp-date">Vào làm: {{ emp.startDate }}</span>
          </div>
        </td>
        <td><span class="branch-tag">{{ emp.branchName }}</span></td>
        <td>{{ emp.position }}</td>
        <td><span class="phone-text">{{ emp.phone }}</span></td>
        <td style="text-align: right;"><strong class="rate-text">{{ emp.hourlyRate.toLocaleString('vi-VN') }}đ/h</strong></td>
        <td>
          <app-admin-status-badge
            [label]="emp.statusLabel"
            [variant]="emp.statusVariant"
            size="sm"
          />
        </td>
        <td style="text-align: center;">
          <button
            type="button"
            class="btn-row-action"
            title="Chuyển trạng thái thôi việc"
            [disabled]="emp.status === 'resigned'"
            (click)="confirmDeleteEmployee(emp, $event)"
          >
            <svg lucideTrash2 class="row-icon" aria-hidden="true"></svg>
          </button>
        </td>
      </tr>
    </ng-template>
  </app-admin-data-table>

  <!-- Create Employee Drawer -->
  <app-admin-drawer
    [isOpen]="isDrawerOpen()"
    title="Thêm nhân viên mới"
    subtitle="Nhập thông tin nhân sự và thiết lập mức lương theo giờ"
    width="32rem"
    (close)="closeDrawer()"
  >
    <form class="drawer-form" [formGroup]="employeeForm" (ngSubmit)="submitEmployee()">
      <app-admin-form-field
        label="Họ và tên nhân viên"
        htmlFor="drawer-fullName"
        [required]="true"
        [error]="employeeForm.controls.fullName.touched && employeeForm.controls.fullName.invalid ? 'Họ tên bắt buộc và tối thiểu 3 ký tự' : null"
      >
        <input
          id="drawer-fullName"
          type="text"
          formControlName="fullName"
          placeholder="Ví dụ: Nguyễn Văn Minh"
        />
      </app-admin-form-field>

      <app-admin-form-field label="Chi nhánh làm việc" htmlFor="drawer-branch" [required]="true">
        <select id="drawer-branch" formControlName="branchId">
          @for (branch of branchService.branches(); track branch.id) {
            @if (branch.id !== 'all') {
              <option [value]="branch.id">{{ branch.name }} ({{ branch.code }})</option>
            }
          }
        </select>
      </app-admin-form-field>

      <app-admin-form-field label="Chức vụ chuyên môn" htmlFor="drawer-position" [required]="true">
        <select id="drawer-position" formControlName="position">
          <option value="Quản lý Cửa hàng">Quản lý Cửa hàng</option>
          <option value="Trưởng ca Pha chế">Trưởng ca Pha chế</option>
          <option value="Barista Chuyên nghiệp">Barista Chuyên nghiệp</option>
          <option value="Barista Part-time">Barista Part-time</option>
          <option value="Nhân viên Thu ngân">Nhân viên Thu ngân</option>
          <option value="Nhân viên Phục vụ">Nhân viên Phục vụ</option>
        </select>
      </app-admin-form-field>

      <app-admin-form-field
        label="Số điện thoại liên hệ"
        htmlFor="drawer-phone"
        [required]="true"
        [error]="employeeForm.controls.phone.touched && employeeForm.controls.phone.invalid ? 'Số điện thoại không hợp lệ (9-11 số)' : null"
      >
        <input
          id="drawer-phone"
          type="tel"
          formControlName="phone"
          placeholder="Ví dụ: 0901 234 567"
        />
      </app-admin-form-field>

      <app-admin-form-field
        label="Đơn giá lương theo giờ (VNĐ/giờ)"
        htmlFor="drawer-rate"
        [required]="true"
        hint="Áp dụng cho giờ làm việc thực tế và tính lương tăng ca (OT x1.5)"
        [error]="employeeForm.controls.hourlyRate.touched && employeeForm.controls.hourlyRate.invalid ? 'Đơn giá tối thiểu 20.000đ/h' : null"
      >
        <input
          id="drawer-rate"
          type="number"
          step="1000"
          formControlName="hourlyRate"
        />
      </app-admin-form-field>

      <app-admin-form-field label="Tình trạng hợp đồng" htmlFor="drawer-status">
        <select id="drawer-status" formControlName="status">
          <option value="working">Chính thức (Đang làm việc)</option>
          <option value="probation">Thử việc (Đang thử việc)</option>
        </select>
      </app-admin-form-field>
    </form>

    <div footer class="drawer-actions">
      <button type="button" class="btn-secondary" (click)="closeDrawer()">Hủy bỏ</button>
      <button type="button" class="btn-primary" (click)="submitEmployee()">Lưu nhân viên</button>
    </div>
  </app-admin-drawer>

  <!-- Delete Confirmation Modal -->
  <app-admin-modal
    [isOpen]="isModalOpen()"
    title="Xác nhận chuyển trạng thái thôi việc"
    [message]="'Bạn có chắc chắn muốn chuyển trạng thái nhân viên ' + (employeeToDelete()?.fullName || '') + ' (' + (employeeToDelete()?.code || '') + ') sang đã nghỉ việc không? Dữ liệu lịch sử chấm công và bảng lương vẫn được lưu trữ.'"
    confirmText="Xác nhận cho nghỉ"
    cancelText="Giữ lại"
    variant="danger"
    (confirm)="executeDelete()"
    (cancel)="isModalOpen.set(false)"
  />
</div>
