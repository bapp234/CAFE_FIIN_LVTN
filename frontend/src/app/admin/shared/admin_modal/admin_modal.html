@if (isOpen()) {
  <div class="modal-overlay" (click)="!isLoading() && cancel.emit()" aria-hidden="true"></div>

  <div class="modal-wrapper">
    <div
      class="modal-card"
      role="alertdialog"
      aria-modal="true"
      [attr.aria-label]="title()"
    >
      <div class="modal-body">
        <div class="icon-wrap" [class.icon-danger]="variant() === 'danger'" [class.icon-warning]="variant() === 'warning'">
          @if (variant() === 'danger') {
            <svg lucideAlertTriangle class="modal-icon" aria-hidden="true"></svg>
          } @else if (variant() === 'warning') {
            <svg lucideHelpCircle class="modal-icon" aria-hidden="true"></svg>
          } @else {
            <svg lucideCheckCircle class="modal-icon" aria-hidden="true"></svg>
          }
        </div>

        <div class="content-wrap">
          <h2 class="modal-title">{{ title() }}</h2>
          @if (message()) {
            <p class="modal-message">{{ message() }}</p>
          }
          <ng-content></ng-content>
        </div>
      </div>

      <footer class="modal-footer">
        <button
          type="button"
          class="btn-cancel"
          [disabled]="isLoading()"
          (click)="cancel.emit()"
        >
          {{ cancelText() }}
        </button>

        <button
          type="button"
          class="btn-confirm"
          [class.btn-danger]="variant() === 'danger'"
          [class.btn-warning]="variant() === 'warning'"
          [class.btn-primary]="variant() === 'primary'"
          [disabled]="isLoading()"
          (click)="confirm.emit()"
        >
          @if (isLoading()) {
            <span class="spinner" aria-hidden="true"></span>
            <span>Đang xử lý...</span>
          } @else {
            <span>{{ confirmText() }}</span>
          }
        </button>
      </footer>
    </div>
  </div>
}
