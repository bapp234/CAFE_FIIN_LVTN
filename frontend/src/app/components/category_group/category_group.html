<app-category-item
  [category]="category()"
  [active]="category().id === activeId()"
  [expandable]="hasChildren()"
  [expanded]="expanded()"
  (selected)="onParentSelected($event)"
  (toggle)="toggle()"
/>

@if (hasChildren()) {
  <!-- inert khi đang thu gọn: các mục con ẩn không thể focus bằng bàn phím -->
  <div class="children" [class.is-open]="expanded()" [attr.inert]="expanded() ? null : ''">
    <ul class="children-inner">
      @for (child of children(); track child.id; let last = $last) {
        <li>
          <app-category-item
            [category]="child"
            [level]="1"
            [isLast]="last"
            [active]="child.id === activeId()"
            (selected)="selected.emit($event)"
          />
        </li>
      }
    </ul>
  </div>
}
