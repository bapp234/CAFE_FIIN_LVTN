<div
  class="cat-row"
  [class.level-1]="level() === 1"
  [class.is-last]="isLast()"
  [class.is-active]="active()"
>
  <a
    class="cat-link"
    [href]="'#' + category().id"
    [attr.aria-current]="active() ? 'true' : null"
    (click)="onClick($event)"
  >
    <span class="cat-chip">
      <app-category-icon [name]="category().icon" />
    </span>
    <span class="cat-name">{{ category().name }}</span>
  </a>

  @if (expandable()) {
    <button
      type="button"
      class="cat-toggle"
      [attr.aria-expanded]="expanded()"
      [attr.aria-label]="toggleLabel()"
      (click)="toggle.emit()"
    >
      <svg lucideChevronRight class="cat-arrow" aria-hidden="true"></svg>
    </button>
  }
</div>
