@switch (name()) {
  @case ('coffee') {
    <svg lucideCoffee class="icon" aria-hidden="true"></svg>
  }
  @case ('leaf') {
    <svg lucideLeaf class="icon" aria-hidden="true"></svg>
  }
  @case ('ice-cream') {
    <svg lucideIceCreamCone class="icon" aria-hidden="true"></svg>
  }
  @case ('bean') {
    <svg lucideBean class="icon" aria-hidden="true"></svg>
  }
  @case ('wheat') {
    <svg lucideWheat class="icon" aria-hidden="true"></svg>
  }
  @case ('cake') {
    <svg lucideCakeSlice class="icon" aria-hidden="true"></svg>
  }
  @case ('cup-soda') {
    <svg lucideCupSoda class="icon" aria-hidden="true"></svg>
  }
  @case ('sprout') {
    <svg lucideSprout class="icon" aria-hidden="true"></svg>
  }
  @case ('glass-water') {
    <svg lucideGlassWater class="icon" aria-hidden="true"></svg>
  }
  @case ('package') {
    <svg lucidePackage class="icon" aria-hidden="true"></svg>
  }
  @default {
    <svg lucideUtensils class="icon" aria-hidden="true"></svg>
  }
}
