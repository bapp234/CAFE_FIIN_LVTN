<ng-template #content>
  <span class="circle-btn" aria-hidden="true">
    <span class="circle-box">
      <!-- Icon trên cùng: chờ sẵn, trượt xuống khi hover -->
      <span class="circle-slot slot-hover">
        <ng-container [ngTemplateOutlet]="icon() ?? null"></ng-container>
      </span>
      <!-- Icon hiển thị mặc định -->
      <span class="circle-slot slot-main">
        <ng-container [ngTemplateOutlet]="icon() ?? null"></ng-container>
      </span>
    </span>
  </span>

  <span class="circle-text">
    @if (subLabel()) {
      <span class="sub-label">{{ subLabel() }}</span>
    }
    <span class="main-label" [class.is-bold]="boldLabel()">{{ label() }}</span>
  </span>
</ng-template>

@if (link(); as to) {
  <a class="circle-link" [routerLink]="to" [attr.aria-label]="computedAriaLabel()">
    <ng-container [ngTemplateOutlet]="content"></ng-container>
  </a>
} @else {
  <a class="circle-link" [attr.href]="href()" [attr.aria-label]="computedAriaLabel()">
    <ng-container [ngTemplateOutlet]="content"></ng-container>
  </a>
}
