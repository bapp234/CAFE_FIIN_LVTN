<section class="vouchers-section" aria-label="Mã giảm giá và ưu đãi">
    <div class="vouchers-grid">
        @for (voucher of vouchers(); track voucher.code) {
        <div class="voucher-ticket-card">
            <div class="ticket-left-badge">
                <span class="discount-label">{{ voucher.discount }}</span>
            </div>
            <div class="ticket-right-info">
                <div class="voucher-code-title">NHẬP MÃ: {{ voucher.code }}</div>
                <div class="voucher-cond-text">{{ voucher.condition }}</div>
                <div class="voucher-action-row">
                    <button type="button" class="btn-copy-voucher" (click)="copyVoucher.emit(voucher.code)"
                        [class.is-copied]="voucher.copied">
                        @if (voucher.copied) {
                        <svg lucideCheck class="copy-icon"></svg>
                        <span>Đã chép</span>
                        } @else {
                        <span>Sao chép mã</span>
                        }
                    </button>
                    <a href="#dieu-kien" class="voucher-term-link">Điều kiện</a>
                </div>
            </div>
        </div>
        }
    </div>
</section>
