<section id="newsletter-title" class="newsletter-strip" aria-labelledby="newsletter-heading">
  <div class="newsletter-shell">
    <div class="newsletter-text">
      <h2 id="newsletter-heading" class="newsletter-title">Nhận ưu đãi và tin mới qua email</h2>
      <p class="newsletter-desc">Mỗi tháng một lá thư, không gửi rác đâu.</p>
    </div>

    <div class="newsletter-form-wrap">
      <form class="newsletter-form" (submit)="onSubmit($event)" novalidate>
        <input
          type="email"
          class="newsletter-input"
          placeholder="Email của bạn"
          aria-label="Nhập địa chỉ email của bạn"
          [value]="emailValue()"
          (input)="onInputChange($event)"
        />
        <button type="submit" class="newsletter-btn">
          <span>ĐĂNG KÝ</span>
          <span aria-hidden="true">&rarr;</span>
        </button>
      </form>

      @if (statusMessage(); as msg) {
        <p class="newsletter-status" [class.is-error]="isError()" role="status">
          {{ msg }}
        </p>
      }
    </div>
  </div>
</section>
