<header #headerEl class="landing-header" [class.is-scrolled]="isScrolled()">
  <div class="header-container">
    <div class="brand-block" data-header-item>
      <a href="#section-1" class="brand-link" aria-label="Trang chủ Cà phê Fiin">
        <app-brand-logo></app-brand-logo>
        <span class="brand-name">CÀ PHÊ FIIN</span>
      </a>
    </div>

    <div class="header-right-group" data-header-item>
      <app-navigation-bar></app-navigation-bar>
      <app-button-order></app-button-order>
    </div>

    <button
      type="button"
      class="menu-toggle"
      [attr.aria-expanded]="isMenuOpen()"
      aria-controls="mobile-nav-menu"
      aria-label="Mở hoặc đóng danh mục điều hướng"
      (click)="toggleMenu()"
    >
      @if (isMenuOpen()) {
        <svg lucideX class="toggle-icon"></svg>
      } @else {
        <svg lucideMenu class="toggle-icon"></svg>
      }
    </button>
  </div>

  <nav
    id="mobile-nav-menu"
    class="mobile-nav-panel"
    [class.is-open]="isMenuOpen()"
    aria-label="Điều hướng trên thiết bị di động"
  >
    <ul class="mobile-nav-list">
      <li class="mobile-nav-item">
        <a href="#section-1" class="mobile-nav-link" (click)="closeMenu()">Trang chủ</a>
      </li>
      <li class="mobile-nav-item">
        <a href="#about-title" class="mobile-nav-link" (click)="closeMenu()">Giới thiệu</a>
      </li>
      <li class="mobile-nav-item">
        <a href="#signature-title" class="mobile-nav-link" (click)="closeMenu()">Thực đơn</a>
      </li>
      <li class="mobile-nav-item">
        <a href="#journal-title" class="mobile-nav-link" (click)="closeMenu()">Tin tức</a>
      </li>
      <li class="mobile-nav-item">
        <a href="#newsletter-title" class="mobile-nav-link" (click)="closeMenu()">Liên hệ</a>
      </li>
    </ul>

    <div class="mobile-order-wrapper">
      <app-button-order></app-button-order>
    </div>
  </nav>
</header>
