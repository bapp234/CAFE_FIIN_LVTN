<aside class="sidebar" [class.is-hidden]="!isOpen()" aria-label="Danh mục sản phẩm">
  <app-sidebar-header [title]="title()" />

  <nav>
    <ul class="category-list">
      @for (cat of categories(); track cat.id) {
        <li class="category-row">
          <app-category-item
            [category]="cat"
            [active]="cat.id === activeId()"
            (selected)="onSelected($event)"
          />
        </li>
      }
    </ul>
  </nav>
</aside>
