<section class="bento" [class.has-side]="others().length > 0" aria-roledescription="carousel"
    aria-label="Banner quảng bá món nổi bật">

    <!-- Ô lớn: cả tấm ảnh là vùng bấm -->
    <div class="tile tile-main">
        @for (slide of active(); track currentSlide()) {
        @if (slide.link) {
        <a class="main-slide" [routerLink]="slide.link" [attr.aria-label]="'Xem ' + slide.subtitle">
            <img [src]="slide.image" [alt]="slide.subtitle" class="main-bg" />
            <span class="main-hover-cta">
                <span>Xem ngay</span>
                <svg lucideArrowRight class="cta-arrow"></svg>
            </span>
        </a>
        } @else {
        <button type="button" class="main-slide" [attr.aria-label]="'Xem ' + slide.subtitle"
            (click)="slideClick.emit(currentSlide())">
            <img [src]="slide.image" [alt]="slide.subtitle" class="main-bg" />
            <span class="main-hover-cta">
                <span>Xem ngay</span>
            </span>
        </button>
        }
        }

        <button type="button" class="nav-arrow nav-arrow-prev" (click)="prevClick.emit()" aria-label="Món trước">
            <svg lucideChevronLeft class="nav-icon"></svg>
        </button>
        <button type="button" class="nav-arrow nav-arrow-next" (click)="nextClick.emit()" aria-label="Món sau">
            <svg lucideChevronRight class="nav-icon"></svg>
        </button>
    </div>

    <!-- Các ô nhỏ: những món còn lại -->
    @if (others().length > 0) {
    <div class="side-tiles">
        @for (o of others(); track o.index) {
        <button type="button" class="tile tile-side" (click)="selectSlide.emit(o.index)"
            [attr.aria-label]="'Xem ' + o.slide.subtitle">
            <img [src]="o.slide.image" alt="" class="side-img" />
            <span class="side-hover-cta">
                <span>Xem ngay</span>
            </span>
        </button>
        }
    </div>
    }
</section>
