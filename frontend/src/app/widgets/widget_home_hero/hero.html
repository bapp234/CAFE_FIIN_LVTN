<section class="order-hero-banner" aria-label="Banner quảng bá món nổi bật">
    @if (slides()[currentSlide()]; as slide) {
    <div class="hero-slide-wrapper">
        <div class="hero-text-content">
            <span class="hero-tagline">{{ slide.title }}</span>
            <h1 class="hero-slide-title">{{ slide.subtitle }}</h1>
            <p class="hero-slide-desc">{{ slide.desc }}</p>
            <button type="button" class="btn-order-now" (click)="orderClick.emit()">
                Đặt món ngay
            </button>
        </div>
        <div class="hero-image-box">
            <img [src]="slide.image" [alt]="slide.subtitle" class="hero-img" />
        </div>
    </div>
    }

    <button type="button" class="slide-nav-btn prev-btn" (click)="prevClick.emit()" aria-label="Slide trước">
        <svg lucideChevronLeft class="nav-icon"></svg>
    </button>
    <button type="button" class="slide-nav-btn next-btn" (click)="nextClick.emit()" aria-label="Slide sau">
        <svg lucideChevronRight class="nav-icon"></svg>
    </button>
</section>
